steps:
  - name: gcr.io/cloud-builders/docker
    id: Dockerizing application
    entrypoint: bash
    args:
      [
        '-c',
        'docker build -f deployment-config/Dockerfile -t gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA --build-arg NPM_TOKEN=$$NPM_TOKEN .',
      ]
    secretEnv:
      - NPM_TOKEN
  - name: gcr.io/cloud-builders/docker
    id: Pushing docker image to container registry
    args: ['push', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploying to ${_REGION}
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        '$_SERVICE_NAME',
        '--image',
        'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA',
        '--region',
        '$_REGION',
        '--service-account',
        '$_SERVICE_ACCOUNT',
        '--timeout',
        '$_TIMEOUT',
        '--set-env-vars',
        'API_SECRET_KEY=${_API_SECRET_KEY}',
        '--set-env-vars',
        'BATCH_FILE_SIZE=${_BATCH_FILE_SIZE}',
        '--set-env-vars',
        'MONGO_PUBLISH_ENDPOINT=${_MONGO_PUBLISH_ENDPOINT}',
      ]
images:
  - gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA
substitutions:
  _REGION: us-central1
  _SERVICE_ACCOUNT: mongo-loader@crypto-351521.iam.gserviceaccount.com
  _SERVICE_NAME: mongo-loader
  _SECRET_VERSION: latest
  _NPM_SECRET_KEY: npm-token-key
  _REGISTRY_URL: https://npm.pkg.github.com/
  _TIMEOUT: 30m
  _API_SECRET_KEY: api-secret-key
  _BATCH_FILE_SIZE: '2'
  _MONGO_PUBLISH_ENDPOINT: https://rabbit.dev/mongo/publish
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_NUMBER/secrets/$_NPM_SECRET_KEY/versions/$_SECRET_VERSION
      env: 'NPM_TOKEN'
options:
  substitution_option: ALLOW_LOOSE
